<!DOCTYPE html>
<html>

<head>
  <title>rock-paper-scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
  const computerMove=pickComputerMove();
  playGame('rock',computerMove);
  ">Rock</button>

  <button onclick="
  const computerMove=pickComputerMove();
  playGame('paper',computerMove);
  ">Paper</button>

  <button onclick="
  const computerMove=pickComputerMove();
  playGame('scissors',computerMove);
  ">Scissors</button>

  <button onclick="
    score.wins=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('remove');
  ">Reset Score</button>


  <script>
  //store "score in localStorage" into the score after convert it as a JavaScipt first
    let score=JSON.parse(localStorage.getItem
    ('score'))||{
        wins:0,
        losses:0,
        ties:0
      };

    // if(score === null ){
    //   score={
    //     wins:0,
    //     losses:0,
    //     ties:0
    //   };
    // }

    function playGame(playerMove,computerMove) {
      let result = '';

      if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie.';
        } else if (computerMove === 'paper') {
          result = 'You lose.';
        } else if (computerMove === 'scissors') {
          result = 'You win.';
        }

      }
      else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
        result = 'You win.';
      } else if (computerMove === 'paper') {
        result = 'Tie.';
      } else if (computerMove === 'scissors') {
        result = 'You lose.';
      }
      }
      else if (playerMove === 'scissors') {
        if (computerMove === 'rock') {
        result = 'You lose.';
      } else if (computerMove === 'paper') {
        result = 'You win.';
      } else if (computerMove === 'scissors') {
        result = 'Tie.';
      }
    }

    if(result==='You win.'){
      score.wins+=1;
    }else if(result==='You lose.'){
      score.losses+=1;
    }else if(result==='Tie.'){
      score.ties+=1;
    }//Update a score

    localStorage.setItem('score',JSON.stringify(score));
    //localStorage only support strings
    //strore score in localStorage


      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins:${score.wins},Losses:${score.losses},Ties:${score.ties}`);
    }
function pickComputerMove() {
      let computerMove = '';
      const randomNumber = Math.random();
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 &&
        randomNumber < 2 / 3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2 / 3 &&
        randomNumber < 1) {
        computerMove = 'scissors';
      }
      return computerMove;
    }

  </script>

</body>

</html>
